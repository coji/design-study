<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Study 試作 2</title>
<link rel="icon" href="data:,">
<style>
  /* 枠は無彩色にする。見ている画面の色の判断を狂わせないため */
  /* --line は区切りの線、--edge は入力欄やボタンの縁（地との比 3:1 以上）に使う */
  /* 行送りも 4 の倍数にする（12px は 20px、14px と 16px は 24px）。黒く塗るのは、いま押すべきボタン 1 つだけ */
  /* 文字は 12 / 14 / 16 の 3 段、余白は 4 の倍数、角丸は 4px（部品）と 12px（吹き出し）、操作する部品の高さは 32px にそろえる */
  :root { --bg: #e9e9e9; --panel: #f6f6f6; --ink: #1a1a1a; --muted: #555; --line: #cdcdcd; --edge: #8a8a8a; --control: 32px; --paper-shadow: 0 0 0 1px rgb(0 0 0 / .08), 0 12px 32px -16px rgb(0 0 0 / .35); }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/24px system-ui, -apple-system, "Hiragino Sans", sans-serif; display: grid; grid-template-columns: minmax(0, 1fr) clamp(320px, 30vw, 400px); overflow: hidden; }
  button, textarea, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* 操作する部品。高さと文字をそろえ、途中で折り返さない */
  .seg { display: inline-flex; flex: none; border: 1px solid var(--edge); border-radius: 4px; overflow: hidden; }
  .seg button { border: 0; background: #fff; height: calc(var(--control) - 2px); padding: 0 12px; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--line); }
  /* 選んでいる状態は、塗りつぶさず、下線と太字で示す */
  .seg button[aria-pressed="true"] { background: var(--bg); font-weight: 700; box-shadow: inset 0 -2px 0 var(--ink); }
  .seg button:not([aria-pressed="true"]):not(:disabled):hover { background: var(--panel); }
  .seg button:disabled { color: var(--line); cursor: default; }
  .plain:disabled { color: var(--edge); cursor: default; }
  .plain:disabled:hover { border-color: var(--edge); }
  /* 枠の中に収まるよう、フォーカスの線は内側に描く */
  .seg button:focus-visible { outline-offset: -4px; }
  .plain, .bar select, .bar input { flex: none; height: var(--control); border: 1px solid var(--edge); background: #fff; border-radius: 4px; padding: 0 12px; white-space: nowrap; }
  .bar select { max-width: 200px; text-overflow: ellipsis; }
  .bar input { width: 240px; }
  .plain:hover { border-color: var(--ink); }
  .text { border: 0; background: none; height: var(--control); padding: 0 8px; text-decoration: underline; text-underline-offset: 4px; white-space: nowrap; }
  /* 列を切り替えるタブは、画面の見方の切り替え（枠つき）と形を変える */
  .tabs { display: flex; gap: 16px; }
  .tabs button { border: 0; background: none; height: var(--control); padding: 0; color: var(--muted); white-space: nowrap; }
  .tabs button[aria-pressed="true"] { color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--ink); }
  .primary:active { transform: translateY(1px); }
  .primary { height: var(--control); border: 0; border-radius: 4px; background: var(--ink); color: #fff; font-weight: 700; padding: 0 16px; white-space: nowrap; }
  .primary:disabled { background: var(--line); color: var(--muted); cursor: default; }

  /* 上の帯。左は「画面をどう見るか」、右は「言葉をどう見るか」。2 つの帯は同じ高さで、下の線が 1 本につながる */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; min-height: 49px; border-bottom: 1px solid var(--line); }
  .group { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #tools { gap: 16px; }
  .spacer, .end { margin-left: auto; }
  .end { justify-content: flex-end; }
  .muted { color: var(--muted); font-size: 12px; line-height: 20px; }
  .bar select:disabled { opacity: .4; }
  #go { min-width: 96px; }

  /* 左: 画面 */
  .left { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; }
  .stagewrap { position: relative; margin: 16px; min-height: 0; }
  #stage, #review { position: absolute; inset: 0; }
  /* 記録を見直すあいだ、写しの枠は消さずに隠す（開いたままにして、戻ったときに読み込み直さない） */
  #stage.away { visibility: hidden; }
  .frame { background: #fff; box-shadow: var(--paper-shadow); overflow: hidden; position: relative; }
  .frame iframe { border: 0; transform-origin: 0 0; display: block; }
  .frame img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top left; }
  .cell { position: absolute; border: 0; background: none; padding: 0; text-align: left; }
  .cell.off { visibility: hidden; pointer-events: none; }
  .cell .tag { display: flex; align-items: baseline; gap: 8px; height: 28px; font-size: 12px; line-height: 20px; white-space: nowrap; overflow: hidden; }
  .cell .tag b { font-size: 16px; }
  .cell .tag span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  /* 押せる案は、乗せると細い輪が出る。選んだ案は太い輪。まだできていない案は覆いがかかっていて、押せない */
  .cell.pickable { cursor: pointer; }
  .cell.pickable:hover .frame, .cell.pickable:focus-visible .frame { box-shadow: 0 0 0 2px var(--ink); }
  .cell.picked .frame { box-shadow: 0 0 0 4px var(--ink); }
  .cell:focus-visible { outline: none; }
  /* 作っているあいだの覆い。下に元の画面がうっすら見えるので、できあがりの場所と大きさが先に分かる */
  .veil { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgb(233 233 233 / .82); color: var(--ink); font-size: 12px; line-height: 20px; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
  .veil .dot, .step.doing .dot { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
  @keyframes blink { 50% { opacity: 0; } }
  /* 進み具合。済んだ行は黒い点、いまやっている行は点が明滅する */
  .trace { display: flex; flex-direction: column; gap: 4px; }
  .step { display: flex; gap: 8px; align-items: baseline; }
  .step .dot { position: relative; top: -1px; }
  .step.doing { color: var(--muted); }
  .caret { display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--ink); animation: blink 1s steps(1) infinite; }
  @media (prefers-reduced-motion: reduce) { .veil .dot, .step.doing .dot, .caret { animation: none; } }

  /* 右: 言葉。上から順に積み、入力はいつも下の同じ場所 */
  .right { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; border-left: 1px solid var(--line); background: var(--panel); min-height: 0; min-width: 0; }
  #thread, #records { overflow-y: auto; overflow-x: hidden; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .me { align-self: flex-end; background: #fff; border: 1px solid var(--edge); padding: 4px 12px; border-radius: 12px 12px 4px 12px; max-width: 90%; white-space: pre-wrap; }
  /* 事実を並べるところは箱で囲まず、上の線と余白で区切る。箱にするのは、判定と、製品に渡す指示だけ */
  .card { border-top: 1px solid var(--line); padding-top: 12px; }
  .card h3 { font-size: 14px; font-weight: 700; }
  .card * + h3 { margin-top: 12px; }
  .box { background: #fff; border: 1px solid var(--ink); border-radius: 4px; padding: 12px; }
  .box h3 { font-size: 14px; font-weight: 700; }
  .alert { background: #fff; border: 2px solid var(--ink); border-radius: 4px; padding: 12px; font-weight: 700; }
  .alert pre { font-weight: 400; margin-top: 8px; }
  .quote { margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* 値は、名前の列と値の列をそろえて並べる */
  .values { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0 12px; margin-top: 8px; font-size: 12px; line-height: 20px; font-variant-numeric: tabular-nums; }
  .values.note { font-size: 14px; line-height: 24px; margin-top: 4px; }
  .values dt { color: var(--muted); }
  .values dd { overflow-wrap: anywhere; }
  .values + p { margin-top: 8px; }
  .verdict { background: #fff; border: 1px solid var(--edge); border-radius: 4px; padding: 12px 16px; }
  .verdict.clash { border: 2px solid var(--ink); }
  /* 見出しは文節で折る。1 文字だけ次の行に落とさない */
  .verdict .head, .composer label { word-break: auto-phrase; text-wrap: balance; }
  .verdict .head { font-size: 16px; font-weight: 700; }
  .verdict .claim { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .verdict .why { margin-top: 8px; }
  .list { list-style: none; padding: 0; margin-top: 4px; }
  .list li { padding: 8px 0; border-top: 1px solid var(--line); }
  .list li:first-child { border-top: 0; padding-top: 0; }
  .list li:last-child { padding-bottom: 0; }
  .steps { padding-left: 20px; margin-top: 4px; }
  .rule { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .instruction { white-space: pre-wrap; margin-top: 4px; }
  .box .plain { margin-top: 8px; }
  #records h2 { font-size: 14px; }
  #records section { display: flex; flex-direction: column; gap: 12px; }
  pre { white-space: pre-wrap; font-size: 12px; line-height: 20px; max-height: 160px; overflow: auto; }
  .composer { border-top: 1px solid var(--line); padding: 12px 16px 16px; }
  /* 文の長さが変わっても入力欄が上下しないよう、2 行ぶんを取って下にそろえる */
  .composer label { display: flex; align-items: flex-end; min-height: 48px; font-weight: 700; margin-bottom: 8px; }
  .composer textarea { display: block; width: 100%; height: 68px; resize: none; border: 1px solid var(--edge); border-radius: 4px; background: #fff; padding: 8px 12px; }
  .composer textarea::placeholder, .bar input::placeholder { color: #6b6b6b; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .composer textarea:disabled { background: var(--bg); }
  .composer .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; min-height: var(--control); }
</style>
</head>
<body>
<main class="left" aria-label="画面">
  <div class="bar">
    <div class="group">
      <select id="page" aria-label="見る画面"></select>
      <span class="seg" id="width" role="group" aria-label="画面の幅"><button data-w="pc" aria-pressed="true">PC 幅</button><button data-w="sp" aria-pressed="false">スマホ幅</button></span>
      <form id="capture" class="group" hidden><input id="url" placeholder="取り込む画面の URL" aria-label="取り込む画面の URL"><button class="primary" id="go">取り込む</button><button class="text" type="button" id="cancel">やめる</button></form>
    </div>
    <div class="group end">
      <span class="muted" id="zoomed" hidden>指したところを拡大して表示</span>
      <div class="group" id="tools"></div>
    </div>
  </div>
  <div class="stagewrap"><div id="stage"></div><div id="review" hidden></div></div>
</main>
<aside class="right" aria-label="言葉のやりとりと記録">
  <div class="bar"><span class="tabs" id="tabs" role="group" aria-label="右の列に出すもの"><button data-t="thread" aria-controls="thread composer" aria-pressed="true">やりとり</button><button data-t="records" aria-controls="records" aria-pressed="false">記録</button></span></div>
  <div id="thread"></div>
  <div id="records" hidden></div>
  <form class="composer" id="composer">
    <label for="input" id="prompt"></label>
    <textarea id="input" aria-describedby="hint"></textarea>
    <div class="row"><span class="muted" id="hint"></span><span class="spacer"></span><button class="plain" type="button" id="alt" hidden></button><button class="primary" id="send">送る</button></div>
  </form>
  <p class="sr" role="status" id="status"></p>
</aside>

<script type="module" src="/app/main.js"></script>
</body>
</html>
