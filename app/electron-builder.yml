appId: com.github.coji.design-study
productName: Design Study
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!test/*'
  - '!test-results/*'
  - '!vendor/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.ts'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# 同梱するもののライセンス。OpenAI の DevKit は非商用ライセンスで、配るときにライセンスの写しを添える決まりがある
extraResources:
  - from: vendor/sign-in-with-chatgpt-devkit/LICENSE
    to: licenses/sign-in-with-chatgpt-devkit-LICENSE.txt
  - from: ../LICENSE
    to: licenses/design-study-LICENSE.txt
  - from: ../THIRD_PARTY.md
    to: licenses/THIRD_PARTY.md
mac:
  target:
    - dmg
  category: public.app-category.graphics-design
  # Apple の開発者登録がまだないので、開発者の署名も公証もしない。手元だけで通る署名（ad-hoc）を付ける。
  # 署名がまったくないと、Apple シリコンの Mac では「壊れている」と出て開けない。開くときの警告は出る（README に開き方を書いている）
  identity: '-'
  hardenedRuntime: false
  notarize: false
dmg:
  artifactName: design-study-${version}-${arch}.${ext}
npmRebuild: false
